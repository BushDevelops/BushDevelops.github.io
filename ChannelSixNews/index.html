<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Channel Six News</title>
  
  <!-- Inter Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: white;
      color: black;
      overflow-x: hidden;
    }
    .Desktop {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .Header1 {
      width: 100%;
      padding: 24px 64px;
      background: linear-gradient(90deg, #8F91FC 0%, #555696 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ChannelSix {
      color: #CDD8EF;
      font-size: 56px;
      font-weight: 900;
      line-height: 1.1;
    }
    .Nav {
      display: flex;
      align-items: center;
      gap: 40px;
    }
    .Nav a {
      color: white;
      font-size: 16px;
      font-weight: 500;
      text-transform: capitalize;
      line-height: 23.2px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .Nav a:hover {
      opacity: 0.8;
    }
    .HeadlinesToday {
      width: 100%;
      max-width: 682px;
      margin: 48px auto 24px;
      text-align: center;
      font-size: 64px;
      font-weight: 800;
      line-height: 1.2;
    }
    .FeatureBento1 {
      width: 100%;
      max-width: 1280px;
      padding: 40px 64px 120px;
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
    }
    .Card1 {
      flex: 1 1 336px;
      max-width: 388px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .Card2 {
      flex: 1 1 516px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .Card2:hover {
      transform: translateY(-3px);
      opacity: 0.95;
    }
    .Card3 {
      flex: 1 1 100%;
      width: 100%;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .Card-Image {
      width: 100%;
      height: 348px;
      object-fit: cover;
      border-radius: 16px;
      display: block;
    }
    .Card-Text {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .Card-Title {
      font-size: 24px;
      font-weight: 600;
      line-height: 28.8px;
    }
    .Card-Subtitle {
      color: rgba(0, 0, 0, 0.55);
      font-size: 18px;
      font-weight: 500;
      line-height: 26.1px;
    }
    @media (max-width: 768px) {
      .Header1 {
        padding: 20px 24px;
      }
      .ChannelSix {
        font-size: 36px;
      }
      .Nav {
        gap: 20px;
      }
      .FeatureBento1 {
        padding: 24px 20px 60px;
      }
      .HeadlinesToday {
        font-size: 40px;
      }
      .Card1 {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="Desktop">
    <!-- Full-width header -->
    <header class="Header1">
      <div class="ChannelSix">Channel Six</div>
      <nav class="Nav">
        <a href="https://bush.is-a.dev/ChannelSixNews/about/">About</a>
        <a href="https://bush.is-a.dev/Contact/">Contact</a>
        <a href="https://bush.is-a.dev/ChannelSixNews/SignIn/">Sign In</a>
      </nav>
    </header>

    <!-- Main Title -->
    <h1 class="HeadlinesToday">HEADLINES TODAY</h1>

    <!-- Bento Grid -->
    <main class="FeatureBento1">
      <!-- Card 1 -->
      <article class="Card1">
        <img class="Card-Image" src="card1.png" alt="Channel 6 Logo" />
        <div class="Card-Text">
          <h2 class="Card-Title">No news found</h2>
          <p class="Card-Subtitle">Nothing here yet.</p>
        </div>
      </article>

      <!-- Card 2 (Linked to Report) -->
      <a href="https://bush.is-a.dev/ChannelSixNews/Reports/Protester001" class="Card2">
        <img class="Card-Image" src="card2.png" alt="Protesters raid" />
        <div class="Card-Text">
          <h2 class="Card-Title">Protesters raid and annex NBTF</h2>
          <p class="Card-Subtitle">A story of how a group of protesters raided the NBTF</p>
        </div>
      </a>

      <!-- Card 3 -->
      <article class="Card3">
        <img class="Card-Image" src="card3.png" alt="News Banner" />
        <div class="Card-Text">
          <h2 class="Card-Title">No news found</h2>
          <p class="Card-Subtitle">Nothing here yet.</p>
        </div>
      </article>
    </main>
  </div>

</body>
</html>
