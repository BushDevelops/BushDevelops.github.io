<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Channel Six</title>

    <link rel="stylesheet" href="globals.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="desktop">

        <header class="header">
            <div class="text-wrapper">
                Channel Six
            </div>

            <nav class="navbar">
                <div class="nav-item">Headlines</div>
                <div class="nav-item">About</div>
                <div class="nav-item">Contact</div>
                <div class="nav-item">Sign In</div>
            </nav>
        </header>


        <h1 class="HEADLINES-TODAY">
            Headlines Today
        </h1>


        <main class="feature-bento">

            <article class="card">
                <img
                    class="image"
                    src="img/image-3.png"
                    alt=""
                >

                <div class="text">
                    <div class="text-wrapper-2">
                        No news found
                    </div>

                    <div class="text-wrapper-3">
                        Nothing here yet.
                    </div>
                </div>
            </article>


            <article class="card-2">
                <img
                    class="image"
                    src="img/image.png"
                    alt=""
                >

                <div class="text">
                    <p class="text-wrapper-2">
                        Protesters raid and annex NBTF
                    </p>

                    <p class="text-wrapper-3">
                        A story of how a group of protesters raided the NBTF
                    </p>
                </div>
            </article>


            <article class="card-3">
                <img
                    class="image"
                    src="img/image-2.png"
                    alt=""
                >

                <div class="text-2">
                    <div class="text-wrapper-2">
                        No news found
                    </div>

                    <div class="text-wrapper-3">
                        Nothing here yet.
                    </div>
                </div>
            </article>

        </main>

    </div>

</body>
</html>
